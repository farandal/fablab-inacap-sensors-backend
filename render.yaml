services:
  - type: web
    name: sensores-aggregator
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: API_TOKEN
        sync: false
      - key: SENSOR_TOKENS
        sync: false
      - key: MAX_REGISTROS
        value: "50"
